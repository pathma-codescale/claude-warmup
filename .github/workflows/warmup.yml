# Claude Warmup — generated by Warmup Studio
# Warms up at 06:00 on weekdays (Asia/Colombo).
# To change the schedule, regenerate this file in Warmup Studio, or edit the
# cron lines and the WARMUP_* values below together.
name: Claude Warmup

on:
  schedule:
    # 06:00 local while Asia/Colombo is UTC+05:30
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

concurrency:
  group: claude-warmup
  cancel-in-progress: true

env:
  WARMUP_TZ: 'Asia/Colombo'
  WARMUP_TIMES: '06:00'
  WARMUP_DAYS: '1 2 3 4 5' # 1 = Monday ... 7 = Sunday
  WARMUP_TOLERANCE_MIN: '180'
  WARMUP_MODEL: 'haiku'
  TOKEN_CREATED: '2026-10-18' # the day you ran `claude setup-token`

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the schedule
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now_hm=$(TZ="$WARMUP_TZ" date +%H:%M)
          dow=$(TZ="$WARMUP_TZ" date +%u)
          now=$((10#${now_hm%:*} * 60 + 10#${now_hm#*:}))
          run=false
          for t in $WARMUP_TIMES; do
            tm=$((10#${t%:*} * 60 + 10#${t#*:}))
            late=$(( (now - tm + 1440) % 1440 ))
            day=$dow
            if [ "$now" -lt "$tm" ]; then day=$(( (dow + 5) % 7 + 1 )); fi
            if [ "$late" -lt "$WARMUP_TOLERANCE_MIN" ] && [[ " $WARMUP_DAYS " == *" $day "* ]]; then run=true; fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" != true ]; then
            echo "Skipping: $now_hm in $WARMUP_TZ is not one of your warmup times."
            echo "This is normal for the spare trigger that covers daylight saving changes."
          fi

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Send the warmup message
        id: ping
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "status=missing-token" >> "$GITHUB_OUTPUT"
            echo "::error title=Token missing::Add a CLAUDE_OAUTH_TOKEN secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json
          out="$(mktemp)"
          set +e
          claude -p "hi" --model "$WARMUP_MODEL" --no-session-persistence >"$out" 2>&1
          code=$?
          set -e
          cat "$out"
          if [ $code -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eiq "expired|unauthorized|invalid token|authentication|auth failed|login required|not logged in" "$out"; then
            echo "status=bad-token" >> "$GITHUB_OUTPUT"
            echo "::error title=Token rejected::Run 'claude setup-token' again and update the CLAUDE_OAUTH_TOKEN secret."
            exit 1
          fi
          if grep -qi "rate limit" "$out"; then
            echo "status=rate-limited" >> "$GITHUB_OUTPUT"
            echo "Claude is rate-limited right now. The request still reached Anthropic, so the window is anchored."
            exit 0
          fi
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "::error title=Warmup failed::Claude Code exited with code $code. See the log above."
          exit $code

      - name: Write the run summary
        if: always() && steps.gate.outputs.run == 'true'
        env:
          STATUS: ${{ steps.ping.outputs.status }}
          STARTED: ${{ steps.ping.outputs.started }}
        run: |
          when() { TZ="$WARMUP_TZ" date -d "@$1" '+%a %d %b, %H:%M'; }
          case "$STATUS" in
            ok) result="Sent. Your 5-hour window is anchored." ;;
            rate-limited) result="Rate-limited, but the window is still anchored." ;;
            missing-token) result="Not sent: the CLAUDE_OAUTH_TOKEN secret is missing." ;;
            bad-token) result="Not sent: the token was rejected. Create a new one." ;;
            *) result="Failed. Check the log of the previous step." ;;
          esac
          {
            echo "### Claude warmup"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | $result |"
            if [ "$STATUS" = ok ] || [ "$STATUS" = rate-limited ]; then
              echo "| Window opened | $(when "$STARTED") |"
              echo "| Usage resets | $(when $((STARTED + 18000))) |"
            fi
            echo "| Time zone | $WARMUP_TZ |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TOKEN_CREATED" ] && created=$(date -d "$TOKEN_CREATED" +%s 2>/dev/null); then
            age=$(( ($(date +%s) - created) / 86400 ))
            renew=$(date -d "$TOKEN_CREATED + 365 days" '+%d %b %Y')
            echo "| Token age | $age days (renew before $renew) |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$age" -ge 330 ]; then
              echo "::warning title=Token expires soon::Your token is $age days old. Run 'claude setup-token' and update the secret before $renew."
            fi
          fi
